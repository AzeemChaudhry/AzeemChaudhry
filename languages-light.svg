<svg xmlns="http://www.w3.org/2000/svg" width="440" height="240" viewBox="0 0 440 240" role="img" aria-label="Language focus"><title>Language focus</title><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0891b2"/><stop offset="1" stop-color="#7c3aed"/></linearGradient></defs><style>
.fade{animation:fade .9s ease-out both}
.grow-y{transform-box:fill-box;transform-origin:bottom;animation:growy .9s cubic-bezier(.2,.8,.2,1) both}
.grow-x{transform-box:fill-box;transform-origin:left;animation:growx 1.2s cubic-bezier(.2,.8,.2,1) both}
.pulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes growy{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
