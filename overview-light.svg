<svg xmlns="http://www.w3.org/2000/svg" width="440" height="240" viewBox="0 0 440 240" role="img" aria-label="GitHub overview"><title>GitHub overview</title><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0891b2"/><stop offset="1" stop-color="#7c3aed"/></linearGradient></defs><style>
.fade{animation:fade .9s ease-out both}
.grow-y{transform-box:fill-box;transform-origin:bottom;animation:growy .9s cubic-bezier(.2,.8,.2,1) both}
.grow-x{transform-box:fill-box;transform-origin:left;animation:growx 1.2s cubic-bezier(.2,.8,.2,1) both}
.pulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes growy{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect x=".5" y=".5" width="439" height="239" rx="14" fill="#ffffff" stroke="#d0d7de"/><text x="28" y="40" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#1f2328">GitHub Overview</text><rect class="grow-x" x="28" y="49" width="44" height="3" rx="1.5" fill="url(#g)"/><g class="fade" style="animation-delay:0.00s"><rect x="28" y="72" width="3" height="42" rx="1.5" fill="url(#g)"/><text x="42" y="87" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#59636e">Contributions (1y)</text><text x="42" y="110" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#1f2328">1,820</text></g><g class="fade" style="animation-delay:0.15s"><rect x="234" y="72" width="3" height="42" rx="1.5" fill="url(#g)"/><text x="248" y="87" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#59636e">Current streak</text><text x="248" y="110" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#1f2328">8 days</text></g><g class="fade" style="animation-delay:0.30s"><rect x="28" y="128" width="3" height="42" rx="1.5" fill="url(#g)"/><text x="42" y="143" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#59636e">Longest streak</text><text x="42" y="166" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#1f2328">12 days</text></g><g class="fade" style="animation-delay:0.45s"><rect x="234" y="128" width="3" height="42" rx="1.5" fill="url(#g)"/><text x="248" y="143" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#59636e">Pull requests (1y)</text><text x="248" y="166" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#1f2328">23</text></g><g class="fade" style="animation-delay:0.60s"><rect x="28" y="184" width="3" height="42" rx="1.5" fill="url(#g)"/><text x="42" y="199" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#59636e">Public repositories</text><text x="42" y="222" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#1f2328">17</text></g><g class="fade" style="animation-delay:0.75s"><rect x="234" y="184" width="3" height="42" rx="1.5" fill="url(#g)"/><text x="248" y="199" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#59636e">Years on GitHub</text><text x="248" y="222" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#1f2328">3.1</text></g></svg>